        // ==================================================================
        // STORAGE
        // ==================================================================
        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) return JSON.parse(stored);
            } catch (e) { console.warn('Failed to load stored data.'); }
            return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        function saveData(data) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
            catch (e) { console.warn('Failed to save data.'); }
        }
        let rawSections = loadData();

        // ==================================================================
        // BUILD CATEGORIES (dedupe + merge)
        // ==================================================================
        function buildCategories(sections) {
            const allUrls = new Set();
            const categoryMap = new Map();
            sections.forEach(section => {
                const cat = section.category;
                if (!categoryMap.has(cat)) {
                    categoryMap.set(cat, { emoji: section.emoji || '🔗', links: new Set() });
                }
                const catData = categoryMap.get(cat);
                section.links.forEach(url => {
                    const clean = url.trim();
                    if (clean && !allUrls.has(clean)) {
                        allUrls.add(clean);
                        catData.links.add(clean);
                    }
                });
            });
            for (let [cat, data] of categoryMap.entries()) {
                if (data.links.size === 0) categoryMap.delete(cat);
            }
            const categoriesArray = Array.from(categoryMap.entries()).map(([name, data]) => ({
                name, emoji: data.emoji, links: Array.from(data.links)
            }));
            categoriesArray.sort((a, b) => a.name.localeCompare(b.name));
            return { categoriesArray, totalUrls: allUrls.size };
        }
        let { categoriesArray, totalUrls } = buildCategories(rawSections);

        // ==================================================================
        // RENDER
        // ==================================================================
        const container = document.getElementById('categoriesContainer');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toastText');
        const totalCountEl = document.getElementById('totalCount');
        let toastTimer = null;

        function showToast(message) {
            toastText.textContent = message;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        async function copyLink(url) {
            try {
                await navigator.clipboard.writeText(url);
                showToast('✅ Link copied to the void');
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = url;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('📋 Link copied');
            }
        }

        function openInNewTab(url) { window.open(url, '_blank', 'noopener,noreferrer'); }

        function openInAboutBlank(url) {
            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head><title>7VxProxy · redirecting...</title></head>
                    <body style="background:#050005; color:#dc2626; font-family:Georgia,serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; flex-direction:column; gap:20px;">
                        <p style="font-size:14px; letter-spacing:4px; text-transform:uppercase;">⏳ summoning ${url.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</p>
                        <script>window.location.href = "${url.replace(/"/g, '\\"')}";<\/script>
                    </body>
                    </html>
                `);
                win.document.close();
            } else { window.open(url, '_blank'); }
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function createCard(url) {
            const card = document.createElement('div');
            card.className = 'card';
            const urlDiv = document.createElement('div');
            urlDiv.className = 'url-display';
            urlDiv.innerHTML = `<i class="fas fa-link"></i> ${escapeHtml(url)}`;
            const btnGroup = document.createElement('div');
            btnGroup.className = 'btn-group';
            const copyBtn = document.createElement('button');
            copyBtn.className = 'btn btn-copy';
            copyBtn.innerHTML = `<i class="fas fa-copy"></i> Copy`;
            copyBtn.addEventListener('click', (e) => { e.stopPropagation(); copyLink(url); });
            const openBtn = document.createElement('button');
            openBtn.className = 'btn btn-open';
            openBtn.innerHTML = `<i class="fas fa-external-link-alt"></i> Open`;
            openBtn.addEventListener('click', (e) => { e.stopPropagation(); openInNewTab(url); });
            const blankBtn = document.createElement('button');
            blankBtn.className = 'btn btn-blank';
            blankBtn.innerHTML = `<i class="fas fa-window-restore"></i> about:blank`;
            blankBtn.addEventListener('click', (e) => { e.stopPropagation(); openInAboutBlank(url); });
            btnGroup.appendChild(copyBtn);
            btnGroup.appendChild(openBtn);
            btnGroup.appendChild(blankBtn);
            card.appendChild(urlDiv);
            card.appendChild(btnGroup);
            return card;
        }

        function render(filterText = '') {
            const term = filterText.trim().toLowerCase();
            container.innerHTML = '';
            let totalVisible = 0;
            let delayIndex = 0;
            categoriesArray.forEach(cat => {
                const filteredLinks = term ? cat.links.filter(url => url.toLowerCase().includes(term)) : cat.links;
                if (filteredLinks.length === 0) return;
                totalVisible += filteredLinks.length;
                const section = document.createElement('div');
                section.className = 'category reveal';
                if (delayIndex < 6) section.classList.add(`reveal-delay-${delayIndex + 1}`);
                delayIndex = (delayIndex + 1) % 6;
                const header = document.createElement('div');
                header.className = 'category-header';
                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.innerHTML = `
                    <span class="emoji-badge">${cat.emoji}</span>
                    ${escapeHtml(cat.name)}
                    <span class="count-badge">${filteredLinks.length}</span>
                `;
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'category-actions';
                const copyAllBtn = document.createElement('button');
                copyAllBtn.className = 'btn-sm';
                copyAllBtn.innerHTML = `<i class="fas fa-copy"></i> Copy All`;
                copyAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const allText = filteredLinks.join('\n');
                    navigator.clipboard.writeText(allText).then(() => {
                        showToast(`📋 ${filteredLinks.length} links copied`);
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = allText;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                        showToast(`📋 ${filteredLinks.length} links copied`);
                    });
                });
                const openAllBtn = document.createElement('button');
                openAllBtn.className = 'btn-sm';
                openAllBtn.innerHTML = `<i class="fas fa-external-link-alt"></i> Open All`;
                openAllBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    filteredLinks.forEach((url, idx) => {
                        setTimeout(() => { window.open(url, '_blank', 'noopener,noreferrer'); }, idx * 120);
                    });
                    showToast(`🌐 Opening ${filteredLinks.length} tabs...`);
                });
                actionsDiv.appendChild(copyAllBtn);
                actionsDiv.appendChild(openAllBtn);
                header.appendChild(titleDiv);
                header.appendChild(actionsDiv);
                const grid = document.createElement('div');
                grid.className = 'link-grid';
                filteredLinks.forEach(url => { grid.appendChild(createCard(url)); });
                section.appendChild(header);
                section.appendChild(grid);
                container.appendChild(section);
            });
            if (totalVisible === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'no-result';
                emptyDiv.innerHTML = `<i class="fas fa-ghost" style="margin-right: 12px; opacity: 0.6;"></i> Nothing found in the darkness for "${escapeHtml(filterText)}"`;
                container.appendChild(emptyDiv);
            }
            requestAnimationFrame(() => {
                document.querySelectorAll('.reveal').forEach(el => { observer.observe(el); });
            });
        }

        // ==================================================================
        // SCROLL REVEAL
        // ==================================================================
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

        function observeAllReveals() {
            document.querySelectorAll('.reveal').forEach(el => { observer.observe(el); });
        }

        totalCountEl.textContent = totalUrls;
        render();
        observeAllReveals();

        searchInput.addEventListener('input', (e) => { render(e.target.value); });

        window.addEventListener('keydown', (e) => {
            if (e.key === '/' && !e.target.matches('input, textarea, select')) {
                e.preventDefault();
                searchInput.focus();
            }

        const newLinkUrl = document.getElementById('newLinkUrl');
        const newLinkCategory = document.getElementById('newLinkCategory');
        const newCategoryName = document.getElementById('newCategoryName');
        const newCategoryEmoji = document.getElementById('newCategoryEmoji');
        let isAdminAuthenticated = false;

        function openAdmin() {
            adminOverlay.classList.add('active');
            if (isAdminAuthenticated) showAdminDashboard(); else showAdminLogin();
        }
        function closeAdmin() {
            adminOverlay.classList.remove('active');
            adminPasswordInput.value = '';
            adminError.textContent = '';
        }
        function showAdminLogin() {
            adminLoginView.style.display = 'block';
            adminDashboardView.style.display = 'none';
            setTimeout(() => adminPasswordInput.focus(), 100);
        }
        function showAdminDashboard() {
            adminLoginView.style.display = 'none';
            adminDashboardView.style.display = 'block';
            refreshAdminData();
        }
        function checkAdminPassword() {
            const entered = adminPasswordInput.value;
            if (entered === ADMIN_PASSWORD) {
                isAdminAuthenticated = true;
                adminError.textContent = '';
                adminPasswordInput.value = '';
                showAdminDashboard();
                showToast('🔓 Access granted');
            } else {
                adminError.textContent = '❌ Wrong password. The spirits are angry.';
                adminPasswordInput.value = '';
                adminPasswordInput.focus();
                adminPasswordInput.style.borderColor = '#ff2d2d';
                setTimeout(() => { adminPasswordInput.style.borderColor = ''; }, 800);
            }
        }
        function refreshAdminData() {
            const currentCat = newLinkCategory.value;
            newLinkCategory.innerHTML = '<option value="">— Select Category —</option>';
            categoriesArray.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.textContent = `${cat.emoji} ${cat.name}`;
                newLinkCategory.appendChild(opt);
            });
            if (currentCat) newLinkCategory.value = currentCat;
            renderAdminLinkList();
        }
        function renderAdminLinkList() {
            adminLinkList.innerHTML = '';
            let count = 0;
            categoriesArray.forEach(cat => {
                cat.links.forEach(url => {
                    count++;
                    const item = document.createElement('div');
                    item.className = 'admin-link-item';
                    const info = document.createElement('div');
                    info.className = 'link-info';
                    info.innerHTML = `
                        <div class="link-url">${escapeHtml(url)}</div>
                        <div class="link-category"><i class="fas fa-tag"></i> ${escapeHtml(cat.emoji)} ${escapeHtml(cat.name)}</div>
                    `;
                    const actions = document.createElement('div');
                    actions.className = 'link-actions';
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.innerHTML = '<i class="fas fa-trash-alt"></i>';
                    deleteBtn.title = 'Delete link';
                    deleteBtn.addEventListener('click', () => {
                        if (confirm(`Banish this link to the void?\n${url}`)) {
                            deleteLinkFromData(cat.name, url);
                        }
                    });
                    actions.appendChild(deleteBtn);
                    item.appendChild(info);
                    item.appendChild(actions);
                    adminLinkList.appendChild(item);
                });
            });
            adminLinkCount.textContent = count;
            if (count === 0) {
                adminLinkList.innerHTML = '<div style="text-align:center; color:#5a3a3a; padding:20px; font-style:italic;">The void is empty. Add a link above.</div>';
            }
        }
        function addNewLink() {
            const url = newLinkUrl.value.trim();
            const categoryName = newLinkCategory.value;
            if (!url) { showToast('⚠️ Enter a URL'); newLinkUrl.focus(); return; }
            if (!categoryName) { showToast('⚠️ Select a category'); newLinkCategory.focus(); return; }
            let section = rawSections.find(s => s.category === categoryName);
            if (!section) {
                const emojiMatch = categoryName.match(/^(\p{Emoji})/u);
                const emoji = emojiMatch ? emojiMatch[1] : '🔗';
                section = { category: categoryName, emoji, links: [] };
                rawSections.push(section);
            }
            const allUrls = new Set();
            rawSections.forEach(s => s.links.forEach(u => allUrls.add(u)));
            if (allUrls.has(url)) { showToast('⚠️ This link already exists in the crypt!'); return; }
            section.links.push(url);
            saveData(rawSections);
            const built = buildCategories(rawSections);
            categoriesArray = built.categoriesArray;
            totalUrls = built.totalUrls;
            totalCountEl.textContent = totalUrls;
            render(searchInput.value);
            refreshAdminData();
            newLinkUrl.value = '';
            showToast(`✅ Link added to ${categoryName}`);
        }
        function addNewCategory() {
            const name = newCategoryName.value.trim();
            let emoji = newCategoryEmoji.value.trim();
            if (!name) { showToast('⚠️ Enter a category name'); newCategoryName.focus(); return; }
            if (!emoji) {
                const match = name.match(/^(\p{Emoji})/u);
                emoji = match ? match[1] : '🔗';
            }
            if (rawSections.some(s => s.category === name)) { showToast('⚠️ Category already exists!'); return; }
            rawSections.push({ category: name, emoji, links: [] });
            saveData(rawSections);
            const built = buildCategories(rawSections);
            categoriesArray = built.categoriesArray;
            totalUrls = built.totalUrls;
            totalCountEl.textContent = totalUrls;
            render(searchInput.value);
            refreshAdminData();
            newCategoryName.value = '';
            newCategoryEmoji.value = '';
            showToast(`✅ Category "${name}" created`);
        }
        function deleteLinkFromData(categoryName, url) {
            const section = rawSections.find(s => s.category === categoryName);
            if (section) {
                const idx = section.links.indexOf(url);
                if (idx > -1) section.links.splice(idx, 1);
            }
            rawSections = rawSections.filter(s => s.links.length > 0);
            saveData(rawSections);
            const built = buildCategories(rawSections);
            categoriesArray = built.categoriesArray;
            totalUrls = built.totalUrls;
            totalCountEl.textContent = totalUrls;
            render(searchInput.value);
            refreshAdminData();
            showToast('🗑️ Link banished');
        }
        adminOverlay.addEventListener('click', (e) => {
            if (e.target === adminOverlay) closeAdmin();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && adminOverlay.classList.contains('active')) closeAdmin();
        });

        // ==================================================================
        // PARALLAX FOG
        // ==================================================================
        let ticking = false;
        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(() => {
                    const scrolled = window.pageYOffset;
                    document.querySelectorAll('.fog-orb').forEach((orb, i) => {
                        const speed = (i + 1) * 0.05;
                        orb.style.transform = `translateY(${scrolled * speed}px)`;
                    });
                    ticking = false;
                });
                ticking = true;
            }
        });
    </script>
</body>
</html>
